substitutions:
  device_name: lights-sara-office
  friendly_name: "Sara Office Lights"
  deviceicon: "mdi:light-recessed"
  hotspot_ssid: "Sara Office Lights Recovery"
  wifi_ssid: !secret wifi_ssid
# 6952HA (2-gang 2-way) hardware, ch1 only, no remote switch connected, so no power sensing.
# Lamp is on when the relay is off (wiring), hence the inverted output.

packages:
  common_base: !include packages/common-base.yaml
  mcu: !include packages/bk7231t-wb3s.yaml
  wifi_common: !include packages/wifi-common.yaml
  reboot_common: !include packages/reboot-common.yaml

status_led:
  pin:
    number: P24
    inverted: true

globals:
  - id: sense_edges_1
    type: uint32_t
    initial_value: "0"

output:
  - platform: gpio
    id: relay1
    pin:
      number: P14
      inverted: true

light:
  - platform: binary
    id: light1
    name: None
    icon: ${deviceicon}
    output: relay1
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - platform: gpio
    id: button
    name: "Button"
    pin:
      number: P26
      inverted: true
      mode: INPUT_PULLUP
    on_click:
      - light.toggle: light1
    on_multi_click:
      - timing:
          - on for at least 1s
        then:
          - event.trigger:
              id: button_1
              event_type: "Long Press"
      # Fallback for manual reboot to reconnect to HA after wifi problems
      - timing:
          - on for at least 10s
        then:
          - script.execute: long_press_reboot

  # Power sense input, observed only (diagnostics); doesn't affect the light
  - platform: gpio
    id: sense_raw_1
    pin:
      number: P8
      mode: INPUT_PULLUP
      inverted: true
    internal: true
    on_state:
      - lambda: "id(sense_edges_1)++;"
  - platform: template
    name: "Power Status"
    entity_category: diagnostic
    lambda: "return id(sense_raw_1).state;"
    filters:
      - delayed_on_off: 30ms

sensor:
  # Raw sense edges per 10s; steady = 0, one switch event = 1
  - platform: template
    name: "Power Status Edges"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      uint32_t n = id(sense_edges_1);
      id(sense_edges_1) = 0;
      if (n) ESP_LOGI("diag", "Power Status edges in 10s: %u", n);
      return n;

# Event exposed to HA (doesn't trigger anything within this ESPHome device)
event:
  - platform: template
    id: button_1
    name: Button 1
    device_class: "button"
    event_types:
      - "Long Press"
