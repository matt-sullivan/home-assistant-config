blueprint:
  name: Air Con Limits
  description: "Prevent air con waste, turn off if doors open for 5 minutes (except in fan only mode), and limit target temperature by mode: heat clamps to max, cool clamps to min, and auto/heat_cool clamps inside both bounds."
  domain: automation
  input:
    climate_entity:
      name: Climate entity
      selector:
        entity:
          domain: climate
    door_sensors:
      name: Door sensors (optional)
      description: >-
        List of door/window binary sensors; if any are open for 5 minutes while
        the climate device is heating, cooling or drying it will be turned off.
        Fan only mode is exempt.
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

variables:
  climate_entity: !input climate_entity
  door_sensors: !input door_sensors
  heating_max_temp: "{{ states('input_number.aircon_max_heat_temp') | float }}"
  cooling_min_temp: "{{ states('input_number.aircon_min_cool_temp') | float }}"
  auto_min_temp: "{{ [cooling_min_temp, heating_max_temp] | min }}"
  auto_max_temp: "{{ [cooling_min_temp, heating_max_temp] | max }}"
  current_target_temp: "{{ state_attr(climate_entity, 'temperature') | float(0) }}"

trigger:
  # Explicitly trigger on state changes to the climate entity, or changes to the temperature
  # attribute, so we can clamp the target temperature if it goes out of bounds, but we don't get
  # spurious triggers from other attribute changes (e.g. current temp). 
  - platform: state
    entity_id: !input climate_entity
    attribute: temperature
    id: climate_changed
  - platform: state
    entity_id: !input climate_entity
    to:
      - "off"
      - heat
      - cool
      - auto
      - heat_cool
    id: climate_changed
  # Door shutoff: fires when a door has been open, or the AC has been in an
  # active (non fan only) mode, for 5 minutes; the door branch conditions check
  # the other has too. Fan only, off and unavailable are not active modes.
  - platform: state
    entity_id: !input door_sensors
    to: "on"
    for: '00:05:00'
    id: door_open
  - platform: state
    entity_id: !input climate_entity
    to:
      - heat
      - cool
      - auto
      - heat_cool
      - dry
    for: '00:05:00'
    id: door_open
  # Restart safety net: states change before automations attach, so the state
  # triggers above miss them. last_changed is reset at restart, so this fires
  # ~10 minutes after startup and the conditions apply the 5 minutes.
  - platform: template
    value_template: "{{ now() - states('sensor.uptime') | as_datetime(now()) >= timedelta(minutes=10) }}"
    id: door_open

action:
  - choose:
      # --- Door trigger: a door open and AC in an active mode, both for 5 minutes ---
      - conditions:
          - condition: trigger
            id: door_open
          - condition: state
            entity_id: !input door_sensors
            state: "on"
            for: '00:05:00'
            match: any
          - condition: state
            entity_id: !input climate_entity
            state:
              - heat
              - cool
              - auto
              - heat_cool
              - dry
            for: '00:05:00'
        sequence:
          - service: notify.parents
            data:
              message: >-
                Air con turned off at {{ now().strftime("%H:%M") }} because a door is open: {{ expand(door_sensors) | selectattr('state', 'equalto', 'on') | map(attribute='name') | join(', ') }}
          - service: climate.turn_off
            target:
              entity_id: !input climate_entity

      # --- Climate trigger: clamp temperature by mode (heat) ---
      - conditions:
          - condition: trigger
            id: climate_changed
          - condition: state
            entity_id: !input climate_entity
            state: heat
          - condition: template
            value_template: "{{ current_target_temp > heating_max_temp }}"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ heating_max_temp }}"

      # --- Climate trigger: clamp temperature by mode (cool) ---
      - conditions:
          - condition: trigger
            id: climate_changed
          - condition: state
            entity_id: !input climate_entity
            state: cool
          - condition: template
            value_template: "{{ current_target_temp < cooling_min_temp }}"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ cooling_min_temp }}"

      # --- Climate trigger: clamp temperature by mode (auto/heat_cool) - over max ---
      - conditions:
          - condition: trigger
            id: climate_changed
          - condition: template
            value_template: "{{ states(climate_entity) in ['auto', 'heat_cool'] }}"
          - condition: template
            value_template: "{{ current_target_temp > auto_max_temp }}"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ auto_max_temp }}"

      # --- Climate trigger: clamp temperature by mode (auto/heat_cool) - under min ---
      - conditions:
          - condition: trigger
            id: climate_changed
          - condition: template
            value_template: "{{ states(climate_entity) in ['auto', 'heat_cool'] }}"
          - condition: template
            value_template: "{{ current_target_temp < auto_min_temp }}"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ auto_min_temp }}"

mode: restart