# Grid connect light switch with fan speed control, 6914HA - shared logic
# Pin substitutions must be provided by series1/series2/series3 packages:
# status_led_pin, relay_light_pin, fan_light_button_pin, fan_power_button_pin,
# fan_speed_button_pin, relay_fan_1_pin, relay_fan_2_pin, relay_fan_3_pin

substitutions:
  # Press-only: light button doesn't toggle its own relay (powers no lamp; see udp-link-remote.yaml)
  light_press_only: false

# The relays control the fan speed by switching the capacitance in series with the fan.
# Each relay is an independent (parallel) path from live to the fan
#   relay 1: 2x 1uF in parallel (2uF)
#   relay 2: 1x 1uF
#   relay 3: direct, bypasses the caps
# I measured these on a series 3 with a multimeter and capacitor for dummy load.
# Speeds: 1 = relay 1 (2uF), 2 = relays 1+2 (3uF), 3 = relays 1+2+3 (full).
# The fan would run full speed with just relay 3, but the same gpio also controls the leds in the speed button.

light:
  - platform: binary
    output: relay_light
    id: light1
    name: "${light_name}"

status_led:
  pin:
    number: ${status_led_pin}
    inverted: True

output:
  - platform: gpio
    id: relay_light
    pin: ${relay_light_pin}
  - platform: template
    id: fan_speed
    type: float
    write_action:
      - then:
        - if:
            condition:
              lambda: return ((state > 0) && (state < .4));
            then:
              - switch.turn_on: relay_fan_1
              - delay: 20ms
              - switch.turn_off: relay_fan_2
              - delay: 20ms
              - switch.turn_off: relay_fan_3
        - if:
            condition:
              lambda: return ((state > .4) && (state < .7));
            then:
              - switch.turn_on: relay_fan_1
              - delay: 20ms
              - switch.turn_on: relay_fan_2
              - delay: 20ms
              - switch.turn_off: relay_fan_3
        - if:
            condition:
              lambda: return (state > .7);
            then:
              - switch.turn_on: relay_fan_1
              - delay: 20ms
              - switch.turn_on: relay_fan_2
              - delay: 20ms
              - switch.turn_on: relay_fan_3
        - if:
            condition:
              lambda: return (state < 0.01);
            then:
              - switch.turn_off: relay_fan_1
              - delay: 20ms
              - switch.turn_off: relay_fan_2
              - delay: 20ms
              - switch.turn_off: relay_fan_3

binary_sensor:
  - platform: gpio
    id: fan_light_button
    pin:
      number: ${fan_light_button_pin}
      mode: INPUT
      inverted: True
    on_click:
      # Press-only: don't toggle (udp-link-remote extends on_press)
      - if:
          condition:
            lambda: "return ${ 'false' if light_press_only else 'true' };"
          then:
            - light.toggle: light1
    on_multi_click:
      - timing:
          - on for at least 1s
        then:
          - event.trigger:
              id: button_1
              event_type: "Long Press"
      # Fallback for manual reboot to reconnect to HA after wifi problems
      - timing:
          - on for at least 10s
        then:
          - script.execute: long_press_reboot

  - platform: gpio
    id: fan_power_button
    pin:
      number: ${fan_power_button_pin}
      mode: INPUT
      inverted: True
    on_press:
      then:
        # Toggle the fan off or on, with a special case to set the speed > 0 when turning on
        # It's off and zero after a power cycle and without this logic the button acheives nothing
        - if:
            condition:
              lambda: |-
                return !id(fan_1).state && id(fan_1).speed == 0;
            then:
              - fan.turn_on:
                  id: fan_1
                  speed: 1
            else:
              - fan.toggle: fan_1

  - platform: gpio
    id: fan_speed_button
    pin:
      number: ${fan_speed_button_pin}
      mode: INPUT
      inverted: True
    on_press:
      then:
        - fan.cycle_speed: fan_1

fan:
  - platform: speed
    id: fan_1
    output: fan_speed
    name: "${fan_name}"
    speed_count: 3

switch:
  - platform: gpio
    id: relay_fan_1
    pin: ${relay_fan_1_pin}
  - platform: gpio
    id: relay_fan_2
    pin: ${relay_fan_2_pin}
  - platform: gpio
    id: relay_fan_3
    pin: ${relay_fan_3_pin}

##########################
# Event exposed to HA (doesn't trigger anything within this ESPHome device)
event:
  - platform: template
    id: button_1
    name: Button 1
    device_class: "button"
    event_types:
      - "Long Press"
