frontend:
  extra_module_url:
    - /hacsfiles/kiosk-mode/kiosk-mode.js
  themes:
    danger:
      primary-color: red
    maintenance:
      primary-color: grey
    algae:
      primary-color: green

lovelace:
  # Include ui-lovelace.yaml as the default dashboard (with url lovelace)
  resource_mode: yaml
  resources:
    - url: /hacsfiles/advanced-camera-card/advanced-camera-card.js
      type: module
    - url: /hacsfiles/scheduler-card/scheduler-card.js
      type: module
    - url: /hacsfiles/button-card/button-card.js
      type: module
    - url: /hacsfiles/apexcharts-card/apexcharts-card.js
      type: module
  # Add yaml dashboards
  dashboards:
    lovelace:
      mode: yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true
      filename: ui-lovelace.yaml
    lovelace-emily:
      mode: yaml
      title: "Emily's Bedroom"
      icon: mdi:human-female-dance
      show_in_sidebar: false
      filename: "ui-lovelace-emily.yaml"
    lovelace-toby:
      mode: yaml
      title: "Toby's Bedroom"
      icon: mdi:run
      show_in_sidebar: false
      filename: "ui-lovelace-toby.yaml"
    lovelace-pool: # lovelace-pool is the url, but sidebar entries are sorted based on title
      mode: yaml
      title: Pool
      icon: mdi:pool
      show_in_sidebar: false
      filename: "ui-lovelace-pool.yaml"
 
