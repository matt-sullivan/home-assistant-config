template:
  - sensor:
      - name: power_house_total_energy_daily
        unique_id: power_house_total_energy_daily
        device_class: energy
        state_class: total
        unit_of_measurement: kWh
        state: >
          {{
            (
              (states("sensor.power_house_total_energy_daily_peak") | float(0))
              + (states("sensor.power_house_total_energy_daily_shoulder") | float(0))
              + (states("sensor.power_house_total_energy_daily_off_peak") | float(0))
