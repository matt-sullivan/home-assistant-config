input_number:
  power_tariff_peak_c_per_kwh:
    name: Power Tariff Peak (c/kWh)
    min: 0
    max: 200
    step: 0.001
    unit_of_measurement: c/kWh
    mode: box
    initial: 47.785

  power_tariff_shoulder_c_per_kwh:
    name: Power Tariff Shoulder (c/kWh)
    min: 0
    max: 200
    step: 0.001
    unit_of_measurement: c/kWh
    mode: box
    initial: 25.296

  power_tariff_off_peak_c_per_kwh:
    name: Power Tariff Off-Peak (c/kWh)
    min: 0
    max: 200
    step: 0.001
    unit_of_measurement: c/kWh
    mode: box
    initial: 6.984

  power_tariff_hot_water_c_per_kwh:
    name: Power Tariff Hot Water (c/kWh)
    min: 0
    max: 200
    step: 0.001
    unit_of_measurement: c/kWh
    mode: box
    initial: 19.45

automation:
  - alias: Power Costs - Apply TOU Tariff
    id: power_costs_apply_tou_tariff
    mode: single
    trigger:
      - platform: time
        at: "16:00:00"
        id: peak
      - platform: time
        at: "21:00:00"
        id: shoulder
      - platform: time
        at: "11:00:00"
        id: off_peak
    variables:
      tariff: >
        {% if trigger.id == 'peak' %}
          peak
        {% elif trigger.id == 'shoulder' %}
          shoulder
        {% else %}
          off-peak
        {% endif %}
      utility_meter_tariff_selects: >
        {{
          integration_entities('utility_meter')
          | select('match', '^select\\.power_.*_energy_(daily|monthly)$')
          | reject('search', '_hot_water_')
          | list
        }}
    action:
      - service: select.select_option
        target:
          entity_id: "{{ utility_meter_tariff_selects }}"
        data:
          option: "{{ tariff }}"

template:
  - sensor:
      - name: power_house_total_cost_daily
        unique_id: power_house_total_cost_daily
        unit_of_measurement: "$"
        device_class: monetary
        state: >
          {{
            (((states("sensor.power_house_total_energy_daily_peak") | float(0)) * (states("input_number.power_tariff_peak_c_per_kwh") | float(0)))
            + ((states("sensor.power_house_total_energy_daily_shoulder") | float(0)) * (states("input_number.power_tariff_shoulder_c_per_kwh") | float(0)))
            + ((states("sensor.power_house_total_energy_daily_off_peak") | float(0)) * (states("input_number.power_tariff_off_peak_c_per_kwh") | float(0))))
