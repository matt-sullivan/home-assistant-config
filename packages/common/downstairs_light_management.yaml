input_select:
  downstairs_mode:
    name: Downstairs Mode
    options:
      - daytime
      - evening
      - bedtime
      - pause_until_tomorrow
      - pause_until_changed

automation:
  # One-hour timeout; light selection per mode is in
  # custom_templates/downstairs_lights.jinja.
  - id: downstairs_lights_normal_timeout
    alias: Downstairs lights one-hour timeout
    description: Turn off managed downstairs lights after one hour in daytime or evening mode, and bedroom lights in daytime mode.
    triggers:
      - trigger: template
        value_template: >-
          {%- from 'downstairs_lights.jinja' import macro_one_hour_lights %}
          {%- set one_hour_lights = macro_one_hour_lights | as_function %}
          {%- set mode = states('input_select.downstairs_mode') %}
          {{ mode in ['daytime', 'evening'] and
             expand(one_hour_lights(mode))
             | selectattr('state', 'eq', 'on')
             | selectattr('last_changed', 'lt', now() - timedelta(hours=1))
             | list | count > 0 }}
    actions:
      - repeat:
          for_each: >-
            {%- from 'downstairs_lights.jinja' import macro_one_hour_lights %}
            {%- set one_hour_lights = macro_one_hour_lights | as_function %}
            {{ one_hour_lights(states('input_select.downstairs_mode')) }}
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ is_state(repeat.item, 'on') and
                       (now() - states[repeat.item].last_changed).total_seconds() >= 3600 }}
              then:
                - action: light.turn_off
                  target:
                    entity_id: "{{ repeat.item }}"
    mode: parallel
    max: 20

  - id: downstairs_lights_bedtime_timeout
    alias: Downstairs lights bedtime timeout
    description: Turn off managed downstairs lights after ten minutes in bedtime mode.
    triggers:
      - trigger: template
        value_template: >-
          {{ is_state('input_select.downstairs_mode', 'bedtime') and
             expand('group.downstairs_managed_lights')
             | selectattr('state', 'eq', 'on')
             | selectattr('last_changed', 'lt', now() - timedelta(minutes=10))
             | list | count > 0 }}
    actions:
      - repeat:
          for_each: "{{ expand('group.downstairs_managed_lights') | map(attribute='entity_id') | list }}"
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ is_state(repeat.item, 'on') and
                       (now() - states[repeat.item].last_changed).total_seconds() >= 600 }}
              then:
                - action: light.turn_off
                  target:
                    entity_id: "{{ repeat.item }}"
    mode: parallel
    max: 20

  - id: '1788778977960'
    alias: Emily night lights
    description: Turn on downstairs lights when Emily opens her door at bedtime.
    triggers:
      - trigger: state
        entity_id: binary_sensor.emily_door
        to: "on"
    conditions:
      - condition: state
        entity_id: input_select.downstairs_mode
        state: bedtime
    actions:
      - action: light.turn_on
        target:
          entity_id:
            - light.downstairs_bathroom_lights_lights
            - light.pool_room_tv
    mode: single
