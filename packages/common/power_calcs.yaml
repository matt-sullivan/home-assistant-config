template:
  - sensor:
      - name: "Power - Total House"
        unique_id: power_house_total
        default_entity_id: sensor.power_house_total
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (
            states('sensor.power_meter_total_power') | float(0) +
            states('sensor.power_meter_hot_water_power') | float(0)
          ) | round(3) }}

      - name: "Power - Outlets"
        unique_id: power_house_outlets
        default_entity_id: sensor.power_house_outlets
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (
            states('sensor.power_meter_gpo_power') | float(0)
            - states('sensor.parents_air_con_power_monitor_power') | float(0)
            - states('sensor.emily_air_con_power_monitor_power') | float(0)
            - states('sensor.toby_air_con_power_monitor_power') | float(0)
          ) | round(3) }}

      - name: "Power - Air Con"
        unique_id: power_house_air_con
        default_entity_id: sensor.power_house_air_con
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (
            states('sensor.power_meter_air_con_power') | float(0)
            + states('sensor.parents_air_con_power_monitor_power') | float(0)
            + states('sensor.emily_air_con_power_monitor_power') | float(0)
            + states('sensor.toby_air_con_power_monitor_power') | float(0)
          ) | round(3) }}

      - name: "Power - Lights"
        unique_id: power_house_lights
        default_entity_id: sensor.power_house_lights
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (
            states('sensor.power_meter_lights_power') | float(0)
          ) | round(3) }}

      - name: "Power - Hot Water"
        unique_id: power_house_hot_water
        default_entity_id: sensor.power_house_hot_water
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (
            states('sensor.power_meter_hot_water_power') | float(0)
          ) | round(3) }}

      - name: "Power - Other"
        unique_id: power_house_other
        default_entity_id: sensor.power_house_other
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (
            states('sensor.power_house_total') | float(0)
            - states('sensor.power_house_outlets') | float(0)
            - states('sensor.power_house_air_con') | float(0)
            - states('sensor.power_house_lights') | float(0)
            - states('sensor.power_house_hot_water') | float(0)
          ) | round(3) }}

      - name: "Power - Outlets Other"
        unique_id: power_outlets_other
        default_entity_id: sensor.power_outlets_other
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (
            states('sensor.power_house_outlets') | float(0)
            - states('sensor.kitchen_kitchen_fridge_power') | float(0)
            - states('sensor.kitchen_dishwasher_power') | float(0)
            - states('sensor.kitchen_air_fryer_power') | float(0)
            - states('sensor.upstairs_deck_outside_fridge_power') | float(0)
            - states('sensor.downstairs_downstairs_fridge_power') | float(0)
            - states('sensor.downstairs_washing_machine_power') | float(0)
            - states('sensor.downstairs_clothes_dryer_power') | float(0)
            - states('sensor.downstairs_computer_server_power') | float(0)
            - states('sensor.downstairs_matt_office_power') | float(0)
            - states('sensor.living_room_living_room_tv_power') | float(0)
            - states('sensor.pool_pool_pump_power') | float(0)
            - states('sensor.pool_pool_heater_power') | float(0)
            - states('sensor.parents_bedroom_sara_electric_blanket_power') | float(0)
            - states('sensor.tobys_bedroom_toby_electric_blanket_power') | float(0)
          ) | round(3) }}

      - name: "Power - Living Room Air Con"
        unique_id: living_room_air_con_power
        default_entity_id: sensor.living_room_air_con_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (
            states('sensor.power_monitor_air_con') | float(0)
          ) | round(3) }}
