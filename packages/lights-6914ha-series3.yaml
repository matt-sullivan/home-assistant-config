# Grid Connect 3 button light switch with fan, 6914HA series 3 (CB3S module with BK7231N)
substitutions:
  # Series 3 (CB3S) pin mappings - converted from WB3S positions
  # Found by test on Spare Bedroom: P22, active low (not P10 as listed online and translated from WB3S)
  status_led_pin: P22
  relay_light_pin: P26
  fan_light_button_pin: P14
  fan_power_button_pin: P20
  fan_speed_button_pin: P7
  relay_fan_1_pin: P6
  # Fan wiring measured with a multimeter and capacitor for dummy load.
  #   relay 1 (P6): 2x 1uF in parallel (2uF)
  #   relay 2 (P9): 1x 1uF
  #   relay 3 (P8): direct, bypasses the caps
  relay_fan_2_pin: P9
  relay_fan_3_pin: P8

packages:
  lights_6914ha_common: !include lights-6914ha-common.yaml
