# I don't know if this needs to explicitly be included, but frigate integration depends on it
media_source:

zha:
  enable_quirks: true
  custom_quirks_path: /config/zha_quirks/

recorder:
  commit_interval: 30
  purge_keep_days: 31
  exclude:
    entities:
      - sensor.power_meter_probe_1
      - sensor.power_meter_probe_2
      - sensor.power_meter_probe_4
      - sensor.power_meter_probe_5

# Text to speech
tts:
  - platform: google_translate

panel_custom:
  - name: ha_supervisor_apps
    sidebar_title: Supervisor Apps
    sidebar_icon: mdi:home-assistant
    js_url: /api/hassio/app/entrypoint.js
    url_path: 'config/apps'
    embed_iframe: true
    require_admin: true
    config:
      ingress: Supervisor

person:
  - name: Sara
    id: sara
    user_id: e47941a6895841da96e1afb58282ffdf
    device_trackers:
      - device_tracker.saras_iphone_16

zone:
  - name: HomeStreet1
    latitude: -27.533429
    longitude: 153.078067
    radius: 48
    passive: true
    # Move to Clausen st intersection?
    # latitude: -27.533006348077777
    # longitude: 153.0776193737984
    # radius: 60
    icon: mdi:home-minus
  - name: HomeStreet2
    latitude: -27.534613
    longitude: 153.078958
    radius: 70
    passive: true
    icon: mdi:home-minus


input_boolean:
  music_assistant_no_spotify:
    name: Use Music Assistant not Spotify 
    icon: mdi:folder-music-outline

input_number:
