substitutions:
  device_name: lights-laundry-door
  friendly_name: "Laundry Door Lights"
  hotspot_ssid: "Laundry Door Lights"
  switch_1_name: "Landing"
  switch_2_name: "Tree"
  # Powers no lamp: remote button for lights-back-stairs; its LED mirrors that lamp
  switch_3_name: "Back Stairs Remote"
  switch_3_press_only: true

packages:
  common_base: !include packages/common-base.yaml
  mcu: !include packages/bk7231n-cb3s.yaml
  wifi: !include packages/wifi-outside-and-hall.yaml
  reboot_common: !include packages/reboot-common.yaml
  lights: !include packages/lights-6903ha-series3.yaml
  # Remote button for lights-back-stairs
  link_remote: !include
    file: packages/udp-link-remote.yaml
    vars:
      link: back-stairs
      light_id: light_3
      button_id: button_input_3
