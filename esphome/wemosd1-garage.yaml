# There are outputs from the motor controller for when the motors are running in either direction,
# when the door is at either limit, and a pulse event on the worm gear.
# I had dreams of showing the correct partial position, but I wasted a lot of time on it and the
# internal ESP pull ups and downs gave me grief. (I had a voltage divider connected to D8 but the
# internal pull down caused problems.) The motor up & down inputs are on pin 1 & 2, are normally
# 24v, 0v when running, and 30v spikes. I wanted to use a transistor to pull D2 & D3 down but think
# it's cause problems on D3 at boot. I gave up, it's ok to have just the limit inputs.
substitutions:
  device_name: wemosd1-garage
  friendly_name: "Garage Wemos D1"
  sensor_name: "Garage Door"
  hotspot_ssid: "Wemosd1-Garage"
  wifi_ssid: !secret wifi_ssid_front

preferences:
  flash_write_interval: never

esp8266:
  restore_from_flash: false

packages:
  common_base: !include packages/common-base.yaml
  esp8266_d1_mini: !include packages/esp8266-d1-mini.yaml
  wifi_common: !include packages/wifi-common.yaml
  reboot_common: !include packages/reboot-common.yaml

external_components:  
  - source:
      type: git
      url: https://github.com/muxa/esphome-state-machine
    refresh: 1h

switch:
  - platform: gpio
    internal: true
    name: "${sensor_name} Toggle"
    pin: D1
    id: garage_relay
    icon: "mdi:garage"
    on_turn_on:
      - delay: 200ms
      - switch.turn_off: garage_relay

binary_sensor:
  - platform: gpio
    name: "Fully Closed"
    pin:
      number: D7
      inverted: true
      mode: INPUT
    filters:
      - delayed_on: 200ms
      - delayed_off: 200ms
    # Use on_state_change instead of on_press/on_release to be triggered after boot from unknown
    # and have access to the previous state value.
    on_state_change:
      then:
        - if:
            # ON: door has reached closed limit (initial boot or runtime)
            condition:
              lambda: return x.has_value() && x.value();
            then:
              - state_machine.transition: DETECTED_CLOSED
            else:
              # OFF: only treat as motion if we previously had a known state, i.e. we can
              # confidently say the door just started opening.
              # We'd expect this sensor to transition from unknown to off after a reboot when the
              # door is partially or fully open, but don't know which state so don't treat it as
              # an opening event, just let the default state and fully open sensor handle it.
              if:
                condition:
                  lambda: return x_previous.has_value();
                then:
                  - state_machine.transition: DETECTED_OPENING
  - platform: gpio
    name: "Fully Open"
    pin:
      number: D6
      inverted: true
      mode: INPUT
    filters:
      - delayed_on: 200ms
      - delayed_off: 200ms
    on_state_change:
      then:
        - if:
            # ON: door has reached open limit (initial boot or runtime)
            condition:
              lambda: return x.has_value() && x.value();
            then:
              - state_machine.transition: DETECTED_OPEN
            else:
              # OFF: only treat as motion if we previously had a known state, we expect this to
              # transition from unknown to off after a reboot when the door is closed or partially
              # closed, but we don't know which state so don't treat it as a closing event, just
              # let the default state and closed sensor handle it.
              if:
                condition:
                  lambda: return x_previous.has_value();
                then:
                  - state_machine.transition: DETECTED_CLOSING

text_sensor:
  - platform: state_machine
    id: garage_state_machine
    name: Garage Door State Machine State

state_machine:
  - name: "State Machine"
    id: garage_sm
    diagram: mermaid
    initial_state: OPENING
    states:
      - name: CLOSED
        on_enter:
          - cover.template.publish:
              id: garage
              state: CLOSED
              current_operation: IDLE
      - name: OPENING
        on_enter:
          - cover.template.publish:
              id: garage
              state: OPEN
              current_operation: OPENING
      - name: OPEN
        on_enter:
          - cover.template.publish:
              id: garage
              state: OPEN
              current_operation: IDLE
      - name: CLOSING
        on_enter:
          - cover.template.publish:
              id: garage
              state: OPEN
              current_operation: CLOSING
    inputs:
      - name: DETECTED_OPENING
        transitions:
          - CLOSED -> OPENING
          - CLOSING -> OPENING
          # If the closed limit sensor turns off while in open we can assume it's actually opening
          - OPEN -> OPENING
      - name: DETECTED_OPEN
        transitions:
          - CLOSING -> OPEN
          - CLOSED -> OPEN
          - OPENING -> OPEN
      - name: DETECTED_CLOSING
        transitions:
          - OPENING -> CLOSING
          - OPEN -> CLOSING
      - name: DETECTED_CLOSED
        transitions:
          - CLOSING -> CLOSED
          - OPENING -> CLOSED
          # Don't trust it to go open->closed, something's going wrong with the sensors, stay in
          # some sort of open state
          # - OPEN -> CLOSED
      - name: REQUEST_OPEN
        transitions:
          - CLOSED -> OPENING
          - CLOSING -> OPENING
        on_input:
          - switch.turn_on: garage_relay
      - name: REQUEST_CLOSE
        transitions:
          - OPEN -> CLOSING
          - OPENING -> CLOSING
        on_input:
          - switch.turn_on: garage_relay

cover:
  - platform: template
    name: "${sensor_name}"
    id: garage
    device_class: garage
    assumed_state: true
    open_action: 
      - state_machine.transition: REQUEST_OPEN
    close_action:
      - state_machine.transition: REQUEST_CLOSE
    stop_action:
      - switch.turn_on: garage_relay
