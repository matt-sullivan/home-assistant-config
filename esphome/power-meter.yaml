substitutions:
  device_name: power-meter
  friendly_name: "Power Meter"
  hotspot_ssid: "Power Meter Hotspot"
  wifi_ssid: !secret wifi_ssid_front
  assumed_voltage: "235.0"

packages:
  common_base: !include packages/common-base.yaml
  wifi_front_and_hall: !include packages/wifi-front-and-hall.yaml

esp32:
  board: esp32-s2-saola-1
  framework:
    type: esp-idf

preferences:
  flash_write_interval: never

# spi:
#   clk_pin: GPIO12
#   mosi_pin: GPIO11

time:
  - platform: homeassistant
    id: esptime

sensor:    
  - platform: adc
    pin: GPIO1
    id: Input_1
    attenuation: 12db
    update_interval: 1s
    
  - platform: adc
    pin: GPIO2
    id: Input_2
    attenuation: 12db
    update_interval: 1s
    
  # - platform: adc
  #   pin: GPIO3
  #   id: Input_3
  #   attenuation: 12db
  #   update_interval: 1s
    
  - platform: adc
    pin: GPIO4
    id: Input_4
    attenuation: 12db
    update_interval: 1s
    
  - platform: adc
    pin: GPIO5
    id: Input_5
    attenuation: 12db
    update_interval: 1s
    
  - platform: adc
    pin: GPIO6
    id: Input_6
    attenuation: 12db
    update_interval: 1s

  - platform: ct_clamp
    sensor: Input_1
    id: Probe_1
    name: "Total Current"
    sample_duration: 200ms
    update_interval: 1s
    filters:
      - calibrate_linear:
          # This probe is a 100A CT clamp, and has a different calibration to the others
          # I measured 0.069 -> 5.9, but I'm scaling up by 1.05 to make it more closely match the
          # GPO probe which is the biggest load and I tested with everything else turned off.
          - 0 -> 0
          - 0.069 -> 6.195
  
  - platform: ct_clamp
    sensor: Input_2
    name: "Hot Water Current"
    id: Probe_2
    sample_duration: 200ms
    update_interval: 1s
    filters:
      - calibrate_linear:
          - 0 -> 0
          # hot water wasn't available at the time of calibration
          # copy this from probe 4 & 5 that are roughly 110x factor
          - 0.055 -> 5.9
    
  - platform: ct_clamp
    sensor: Input_4
    name: "GPO Current"
    id: Probe_4
    sample_duration: 200ms
    update_interval: 1s
    filters:
      - calibrate_linear:
          - 0 -> 0
          # Measured multiple times
          - 0.074 -> 8.25 # 111.5
          - 0.075 -> 8.32 # 110.9
          - 0.076 -> 8.45 # 111.2
          # this one seems an anomality
          # - 0.081 -> 8.85 # 109.3

  - platform: ct_clamp
    sensor: Input_5
    name: "Air Con Current"
    id: Probe_5
    sample_duration: 200ms
    update_interval: 1s
    filters:
      - calibrate_linear:
          - 0 -> 0
          - 0.055 -> 5.9
          
  - platform: ct_clamp
    sensor: Input_6
    name: "Lights Current"
    id: Probe_6
    sample_duration: 200ms
    update_interval: 1s
    filters:
      - calibrate_linear:
          - 0 -> 0
          - 0.058 -> 6.45
          
  - platform: template
    id: power_total
    name: "Total Power"
    lambda: return (id(Probe_1).state) * ${assumed_voltage};
    unit_of_measurement: 'W'
    device_class: power
    state_class: measurement
    update_interval: 5s
    accuracy_decimals: 1
    filters:
      - delta: 0.05

  - platform: template
    id: power_hot_water
    name: "Hot Water Power"
    lambda: return (id(Probe_2).state) * ${assumed_voltage}; 
    unit_of_measurement: 'W'
    device_class: power
    state_class: measurement
    update_interval: 5s
    accuracy_decimals: 1
    filters:
      - delta: 0.05

  - platform: template
    id: power_gpo
    name: "GPO Power"
    lambda: return (id(Probe_4).state) * ${assumed_voltage}; 
    unit_of_measurement: 'W'
    device_class: power
    state_class: measurement
    update_interval: 5s
    accuracy_decimals: 1
    filters:
      - delta: 0.05

  - platform: template
    id: power_air_con
    name: "Air Con Power"
    lambda: return (id(Probe_5).state) * ${assumed_voltage}; 
    unit_of_measurement: 'W'
    device_class: power
    state_class: measurement
    update_interval: 5s
    accuracy_decimals: 1
    filters:
      - delta: 0.05

  - platform: template
    id: power_lights
    name: "Lights Power"
    lambda: return (id(Probe_6).state) * ${assumed_voltage}; 
    unit_of_measurement: 'W'
    device_class: power
    state_class: measurement
    update_interval: 5s
    accuracy_decimals: 1
    filters:
      - delta: 0.05
