substitutions:
  device_name: lights-emily-strip
  friendly_name: "Emily Light Bar"
  hotspot_ssid: "Emily Light Bar"

packages:
  common_base: !include packages/common-base.yaml
  mcu: !include packages/esp8266.yaml
  wifi_front_and_hall: !include packages/wifi-front-and-hall.yaml
  reboot_common: !include packages/reboot-common.yaml

#RGBWarm
output:
  - platform: esp8266_pwm
    pin: 12
    frequency: 1000 Hz
    id: pwm_b
  - platform: esp8266_pwm
    pin: 13
    frequency: 1000 Hz
    id: pwm_r
  - platform: esp8266_pwm
    pin: 15
    frequency: 1000 Hz
    id: pwm_g
  - platform: esp8266_pwm
    pin: 14
    frequency: 1000 Hz
    id: pwm_w1
  - platform: esp8266_pwm
    pin: 4
    frequency: 1000 Hz
    id: pwm_w2
light:
  - platform: rgbw
    name: None
    red: pwm_r
    green: pwm_g
    blue: pwm_b
    white: pwm_w1
    color_interlock: true
